<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Infinite - Professional Esports</title>
    
    <meta name="theme-color" content="#09090b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #09090b; --bg-panel: #18181b; --bg-input: #27272a;
            --text-main: #f4f4f5; --text-muted: #a1a1aa;
            --accent: #22c55e; --accent-hover: #16a34a;
            --danger: #ef4444; --danger-hover: #dc2626;
            --border: #3f3f46;
            --x-color: #3b82f6; --o-color: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseHint { 0% { box-shadow: inset 0 0 0 0 rgba(34, 197, 94, 0.7); } 50% { box-shadow: inset 0 0 20px 5px rgba(34, 197, 94, 0.9); } 100% { box-shadow: inset 0 0 0 0 rgba(34, 197, 94, 0); } }

        /* Header Navigation */
        .header { height: 65px; width: 100%; padding: 0 25px; background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon { width: 28px; height: 28px; fill: none; stroke: var(--text-main); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .header h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; margin-top: 2px;}
        
        .desktop-nav { display: flex; gap: 20px; flex: 1; justify-content: center; display: none; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 5px 10px; transition: 0.2s; border-bottom: 2px solid transparent; }
        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { color: #fff; border-bottom-color: var(--accent); }

        .user-nav { display: flex; align-items: center; gap: 15px; display: none; }
        .points-badge { background: rgba(34, 197, 94, 0.12); color: var(--accent); border: 1px solid rgba(34, 197, 94, 0.25); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px;}
        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; object-fit: cover; transition: 0.2s;}
        .nav-avatar:hover { border-color: var(--text-muted); }

        /* Main Area */
        .main-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; animation: fadeIn 0.25s ease-out; }
        .active-screen { display: flex; }

        /* UI Cards & Inputs */
        .card { background: var(--bg-panel); padding: 25px; border-radius: 12px; width: 100%; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; width: 100%; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-input); color: #fff; outline: none; transition: 0.2s; font-size: 0.9rem; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--x-color); }
        .input-group textarea { resize: vertical; min-height: 75px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; font-size: 0.95rem; }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-input); border-color: var(--text-muted); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-random { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-random:hover { background: linear-gradient(135deg, #4f46e5, #9333ea); transform: translateY(-2px); }
        .btn-google { background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
        .list-info { display: flex; align-items: center; gap: 12px; }
        .list-info img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        
        /* Game Screen Layout */
        .game-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 450px; }
        .board-col { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .chat-col { display: flex; flex-direction: column; width: 100%; height: 260px; }

        @media (min-width: 850px) {
            .desktop-nav { display: flex; }
            .screen { max-width: 900px; }
            .game-layout { flex-direction: row; max-width: 900px; align-items: flex-start; justify-content: center; gap: 35px; }
            .board-col { width: 380px; }
            .chat-col { width: 340px; height: 480px; margin-top: 40px; }
        }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; aspect-ratio: 1; background: var(--border); gap: 4px; border: 4px solid var(--border); border-radius: 12px; margin: 15px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .cell { background: var(--bg-main); display: flex; justify-content: center; align-items: center; font-size: 5rem; font-family: 'Outfit', sans-serif; font-weight: 800; cursor: pointer; user-select: none; transition: 0.1s; }
        .cell:hover { background: var(--bg-input); }
        .cell.X { color: var(--x-color); animation: pop 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275); } 
        .cell.O { color: var(--o-color); animation: pop 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hint-anim { animation: pulseHint 1s ease-out; }

        .player-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--bg-panel); padding: 12px 18px; border-radius: 8px; border: 2px solid transparent; transition: 0.25s; }
        .active-turn { border-color: var(--accent); background: rgba(34, 197, 94, 0.04); }
        .player-flag { margin-left: 5px; font-size: 1.1rem; }

        /* Chat System */
        .chat-box { width: 100%; height: 100%; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; }
        .msg-item { background: var(--bg-input); padding: 8px 12px; border-radius: 8px; width: fit-content; max-width: 85%; word-break: break-word; }
        .msg-item.self { background: var(--border); align-self: flex-end; }
        
        .chat-quick-emojis { display: flex; justify-content: space-around; padding: 6px; border-top: 1px solid var(--border); background: var(--bg-input); }
        .emoji-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; transition: 0.15s; }
        .emoji-btn:hover { transform: scale(1.2); }
        
        .chat-input-area { display: flex; border-top: 1px solid var(--border); background: var(--bg-main); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 14px; outline: none; font-size: 0.85rem; }
        .chat-input-area button { background: transparent; color: var(--x-color); border: none; padding: 0 15px; cursor: pointer; font-weight: 600; }

        /* Notifications & Error Handling */
        .notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-main); padding: 10px 20px; border-radius: 6px; font-weight: 700; display: none; z-index: 1000; text-align: center; font-size: 0.9rem; }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: left; margin-bottom: 15px; display: none; border: 1px solid rgba(239, 68, 68, 0.3); line-height: 1.4; word-break: break-word; }

        /* File Upload */
        .file-upload-wrapper { position: relative; width: 90px; height: 90px; margin: 0 auto 15px; cursor: pointer; }
        .file-upload-wrapper img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* Footer Version */
        .footer-version { text-align: center; padding: 12px; font-size: 0.75rem; color: var(--text-muted); background: var(--bg-panel); border-top: 1px solid var(--border); flex-shrink: 0; width: 100%; font-weight: 600; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="noti" class="notification">Message</div>

    <!-- Header Navigation Bar -->
    <div class="header">
        <div class="logo-area" onclick="if(currentUser) switchTab('play')">
            <svg class="logo-icon" viewBox="0 0 24 24"><path d="M4 4l16 16M4 20L20 4"></path></svg>
            <h1>XO INFINITE</h1>
        </div>
        
        <div class="desktop-nav" id="desktop-nav">
            <button class="nav-btn active" onclick="switchTab('play')" id="nav-play">Play</button>
            <button class="nav-btn" onclick="switchTab('bots')" id="nav-bots">Practice</button>
            <button class="nav-btn" onclick="switchTab('friends')" id="nav-friends">Friends</button>
            <button class="nav-btn" onclick="switchTab('profile')" id="nav-profile">Profile</button>
        </div>

        <div class="user-nav" id="user-nav">
            <div class="points-badge">PTS: <span id="nav-points">0</span></div>
            <img id="nav-avatar" class="nav-avatar" src="" onclick="switchTab('profile')">
        </div>
    </div>

    <!-- MAIN DYNAMIC AREA -->
    <div class="main-area">
        
        <!-- 1. AUTH SCREEN -->
        <div id="screen-auth" class="screen active-screen" style="justify-content: center; max-width: 420px;">
            <div class="card">
                <h2 id="auth-title" style="text-align: center; margin-bottom: 20px; font-weight: 700;">Sign In</h2>
                <div id="auth-error" class="error-msg"></div>
                
                <div id="signup-fields" style="display: none;">
                    <div class="input-group">
                        <input type="text" id="reg-username" placeholder="Username (Min 3 characters, alphanumeric)">
                    </div>
                </div>
                
                <div class="input-group"><input type="email" id="email" placeholder="Email Address"></div>
                <div class="input-group"><input type="password" id="password" placeholder="Password"></div>
                
                <div style="text-align: right; margin-top: -8px; margin-bottom: 15px;">
                    <span style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;" onclick="handleForgotPassword()">Forgot Password?</span>
                </div>
                
                <button class="btn" id="btn-action" onclick="processAuth()">Sign In</button>
                <div style="text-align: center; margin: 12px 0; font-size: 0.85rem; cursor: pointer; color: var(--text-muted);" onclick="toggleAuthMode()">
                    <span id="toggle-auth-text">Don't have an account? <span style="color:var(--x-color); font-weight: 600;">Register</span></span>
                </div>
                
                <div style="text-align: center; margin: 12px 0; color: var(--border); font-size: 0.8rem;">OR</div>
                
                <button class="btn btn-google" onclick="loginWithGoogle()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google"> Continue with Google
                </button>
            </div>
        </div>

        <!-- 2. DASHBOARD SCREEN -->
        <div id="screen-dashboard" class="screen">
            
            <!-- Mobile Navigation -->
            <div class="card tab-view" style="padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; border-radius: 8px;" id="mobile-nav">
                 <button class="nav-btn active" onclick="switchTab('play')" id="mob-play" style="flex:1;">Play</button>
                 <button class="nav-btn" onclick="switchTab('bots')" id="mob-bots" style="flex:1;">Bots</button>
                 <button class="nav-btn" onclick="switchTab('friends')" id="mob-friends" style="flex:1;">Friends</button>
                 <button class="nav-btn" onclick="switchTab('profile')" id="mob-profile" style="flex:1;">Profile</button>
            </div>

            <!-- Play View -->
            <div id="view-play" class="card tab-view">
                <h3 style="margin-bottom: 15px;">Global Matchmaking</h3>
                <button class="btn btn-random" onclick="findRandomMatch()">Play Random Match</button>
                
                <h3 style="margin: 25px 0 15px; border-top: 1px solid var(--border); padding-top: 20px;">Custom Room</h3>
                <button class="btn btn-outline" onclick="createRoom()">Create Room</button>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="join-code" placeholder="Enter Room Code" style="flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; text-transform: uppercase;">
                    <button class="btn btn-outline" style="width: auto; margin: 0; padding: 0 20px;" onclick="joinRoomFromInput()">Join</button>
                </div>
            </div>

            <!-- Practice Bots View -->
            <div id="view-bots" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 20px;">AI Difficulty</h3>
                <button class="btn btn-outline" onclick="startBotMatch('beginner')">Beginner Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('intermediate')">Intermediate Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('pro')">Pro Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('legend')">Legend Bot</button>
                <button class="btn" style="background: var(--text-main); color: var(--bg-main);" onclick="startBotMatch('immortal')">Immortal Bot (Unbeatable)</button>
            </div>

            <!-- Friends View -->
            <div id="view-friends" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 15px;">Search Player</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="friend-search" placeholder="Enter Username..." style="flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none;">
                    <button class="btn btn-outline" style="width: auto; margin: 0; padding: 0 20px;" onclick="sendFriendRequest()">Send</button>
                </div>

                <h4 style="margin: 15px 0 10px; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Requests</h4>
                <div id="requests-list"><p style="font-size: 0.85rem; color: var(--border);">No pending requests.</p></div>

                <h4 style="margin: 20px 0 10px; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Friends List</h4>
                <div id="friends-list"></div>
            </div>

            <!-- Profile View -->
            <div id="view-profile" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 20px; text-align: center;">Account Details</h3>
                
                <div class="file-upload-wrapper">
                    <img id="edit-avatar-preview" src="">
                    <input type="file" id="avatar-file" accept="image/*" onchange="handleImageUpload(event)">
                </div>

                <div class="input-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-name">
                </div>
                
                <div class="input-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" placeholder="Add account bio..."></textarea>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div style="flex: 1;">
                        <div class="input-group">
                            <label>Gender</label>
                            <select id="edit-gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div style="flex: 1;">
                        <div class="input-group">
                            <label>Date of Birth</label>
                            <input type="date" id="edit-dob" onchange="calculateAge()">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Calculated Age</label>
                    <input type="text" id="edit-age" placeholder="Age" disabled style="opacity: 0.6;">
                </div>

                <div class="input-group">
                    <label>Country / Flag</label>
                    <select id="edit-country">
                        <option value="">Select Country...</option>

                    </select>
                </div>

                <div class="input-group">
                    <label>Username (System Identifier)</label>
                    <input type="text" id="edit-username" placeholder="username" disabled style="opacity: 0.5;">
                </div>
                
                <button class="btn" onclick="saveProfile()">Save Changes</button>
                <button class="btn btn-outline btn-danger" style="margin-top: 10px; border-color: var(--danger); color: var(--danger);" onclick="logout()">Log Out</button>
            </div>
        </div>

        <!-- 3. GAME SCREEN -->
        <div id="screen-game" class="screen" style="max-width: 900px;">
            <div class="game-layout">
                <div class="board-col">
                    <div style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; background: var(--bg-panel); padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border);">
                        <span id="room-code-display" style="color: var(--text-muted); font-size: 0.85rem;">Code: <strong id="room-display" style="color: #fff;">---</strong></span>
                        <span id="copy-code-btn" onclick="copyInviteLink()" style="color: var(--x-color); cursor: pointer; font-size: 0.85rem; font-weight: 600;">Copy</span>
                    </div>

                    <div class="player-bar" id="opp-bar">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <img id="opp-avatar" src="" style="width:38px; height:38px; border-radius:50%; object-fit:cover; border: 1px solid var(--border);">
                            <div>
                                <div style="font-weight: 600; font-size: 0.95rem;"><span id="opp-name">Waiting...</span> <span id="opp-flag" class="player-flag"></span></div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">Side: <span id="opp-symbol" style="font-weight:700;">O</span></div>

                    <div class="board" id="board"></div>

                    <div class="player-bar" id="my-bar">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <img id="my-avatar" src="" style="width:38px; height:38px; border-radius:50%; object-fit:cover; border: 1px solid var(--border);">
                            <div>
                                <div style="font-weight: 600; font-size: 0.95rem;"><span id="my-name-game">Me</span> <span id="my-flag" class="player-flag"></span></div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">Side: <span id="my-symbol" style="font-weight:700;">X</span></div>

                    <div style="width: 100%; margin-top: 12px;">
                        <button id="hint-btn" class="btn btn-outline" style="border-color: var(--accent); color: var(--accent); display: none; margin-bottom: 10px;" onclick="showHint()">Get Hint 💡</button>
                        
                        <div id="end-actions" style="display: none; gap: 10px; width: 100%;">
                            <button class="btn" style="background: var(--text-main); color: var(--bg-main);" onclick="requestRematch()">Rematch</button>
                            <button class="btn btn-outline" onclick="leaveMatch()">Exit</button>
                        </div>
                        
                        <button id="cancel-btn" class="btn btn-outline btn-danger" style="display: none;" onclick="leaveMatch()">Cancel Match</button>
                        <button id="resign-btn" class="btn btn-outline" style="display: none;" onclick="resignMatch()">Resign Match</button>
                    </div>
                </div>

                <div class="chat-col" id="chat-col-wrapper">
                    <div class="chat-box" id="chat-container">
                        <div class="chat-messages" id="chat-messages">
                            <div style="text-align: center; color: var(--border); font-size: 0.75rem;">Match chat initiated.</div>
                        </div>
                        
                        <div class="chat-quick-emojis">
                            <button class="emoji-btn" onclick="sendEmoji('😡')">😡</button>
                            <button class="emoji-btn" onclick="sendEmoji('😭')">😭</button>
                            <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                            <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                            <button class="emoji-btn" onclick="sendEmoji('💀')">💀</button>
                        </div>
                        
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                            <button onclick="sendChatMessage()">Send</button>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- VERSION FOOTER -->
    <div class="footer-version">Version 1.0</div>

    <script>
        // Adjust UI for Mobile/PC Tabs
        function handleResize() {
            const isDesktop = window.innerWidth >= 850;
            document.getElementById('desktop-nav').style.display = isDesktop ? 'flex' : 'none';
            document.getElementById('mobile-nav').style.display = isDesktop ? 'none' : 'flex';
        }
        window.addEventListener('resize', handleResize); handleResize();

        // Firebase Setup Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyARdbrN_3V1Uk6KJ9JbHa6PJmv5Xtfv9Fw",
            authDomain: "xo-play-e654f.firebaseapp.com",
            databaseURL: "https://xo-play-e654f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xo-play-e654f",
            storageBucket: "xo-play-e654f.firebasestorage.app",
            messagingSenderId: "745980316574",
            appId: "1:745980316574:web:c9e34f46be9fb4c853648f",
            measurementId: "G-82TTJV08M8"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Application State Engine
        let currentUser = null; let userProfile = null;
        let currentRoomId = null; let myRole = null; let matchType = "private";
        let gameActive = false; let currentTurn = 'X'; 
        let currentRoomRef = null; let localBoard = ["", "", "", "", "", "", "", "", ""];
        let isBotMatch = false; let botDifficulty = '';
        let base64Image = ""; let pointsAwarded = false;

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
        function showNoti(msg) { const noti = document.getElementById('noti'); noti.innerText = msg; noti.style.display = 'block'; setTimeout(() => noti.style.display = 'none', 2500); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${tabId}`).style.display = 'block';
            if(document.getElementById(`nav-${tabId}`)) document.getElementById(`nav-${tabId}`).classList.add('active');
            if(document.getElementById(`mob-${tabId}`)) document.getElementById(`mob-${tabId}`).classList.add('active');
            if(tabId === 'friends') loadFriendsData();
        }

        // ==========================================
        // AUTHENTICATION (STRICT GLITCH FIX)
        // ==========================================
        let isLoginMode = true;
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Sign In" : "Create Account";
            document.getElementById('btn-action').innerText = isLoginMode ? "Sign In" : "Register";
            document.getElementById('toggle-auth-text').innerHTML = isLoginMode ? "Don't have an account? <span style='color:var(--x-color); font-weight:600;'>Register</span>" : "Already have an account? <span style='color:var(--x-color); font-weight:600;'>Sign In</span>";
            document.getElementById('signup-fields').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('auth-error').style.display = 'none';
        }

        function handleAuthError(error) {
            const errBox = document.getElementById('auth-error');
            let cleanMsg = "Authentication failed. Please try again.";

            let rawMsg = error.message || "";
            try {
                const parsed = JSON.parse(rawMsg);
                if (parsed.error && parsed.error.message) { rawMsg = parsed.error.message; }
            } catch (e) { }

            const errStr = (error.code + " " + rawMsg).toUpperCase();

            if (errStr.includes('INVALID_LOGIN_CREDENTIALS') || errStr.includes('INVALID_CREDENTIAL') || errStr.includes('WRONG_PASSWORD') || errStr.includes('USER_NOT_FOUND')) {
                cleanMsg = "Invalid Login Credentials.";
            } else if (errStr.includes('EMAIL_ALREADY_IN_USE') || errStr.includes('EMAIL-ALREADY-IN-USE')) {
                cleanMsg = "This email is already registered.";
            } else if (errStr.includes('TOO_MANY_REQUESTS')) {
                cleanMsg = "Too many failed attempts. Try again later.";
            } else if (rawMsg) {
                cleanMsg = rawMsg.replace(/Firebase:/ig, '').trim(); 
            }

            errBox.innerText = cleanMsg;
            errBox.style.display = 'block';
            document.getElementById('btn-action').innerText = isLoginMode ? "Sign In" : "Register";
        }

        function processAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const errBox = document.getElementById('auth-error');
            
            if(!email || !pass) { errBox.innerText = "Please fill in all fields."; errBox.style.display = 'block'; return; }
            document.getElementById('btn-action').innerText = "Processing...";

            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
                if(isLoginMode) {
                    return auth.signInWithEmailAndPassword(email, pass);
                } else {
                    let cleanUser = username.replace(/[^a-z0-9_]/g, '');
                    if(cleanUser !== username || username.length < 3) { throw new Error("Username must be at least 3 alphanumeric characters."); }
                    
                    return db.ref('usernames/' + cleanUser).once('value').then(snap => {
                        if(snap.exists()) { throw new Error("Username is taken."); }
                        return auth.createUserWithEmailAndPassword(email, pass).then(cred => {
                            const defaultAvatar = `https://api.dicebear.com/9.x/bottts-neutral/svg?seed=${cleanUser}`;
                            db.ref('users/' + cred.user.uid).set({
                                username: cleanUser, displayName: cleanUser, photoURL: defaultAvatar, uid: cred.user.uid, points: 0, bio: "", gender: "", country: "", dob: "", age: ""
                            });
                            db.ref('usernames/' + cleanUser).set(cred.user.uid);
                        });
                    });
                }
            }).catch(handleAuthError);
        }

        function loginWithGoogle() {
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
                return auth.signInWithPopup(googleProvider);
            }).then((result) => {
                const user = result.user;
                const emailPrefix = user.email.split('@')[0].replace(/[^a-z0-9_]/g, '');
                db.ref('users/' + user.uid).once('value').then(snap => {
                    if(!snap.exists()) {
                        const defaultAvatar = user.photoURL || `https://api.dicebear.com/9.x/bottts-neutral/svg?seed=${emailPrefix}`;
                        db.ref('users/' + user.uid).set({
                            username: emailPrefix, displayName: user.displayName || "Player", photoURL: defaultAvatar, uid: user.uid, points: 0, bio: "", gender: "", country: "", dob: "", age: ""
                        });
                        db.ref('usernames/' + emailPrefix).set(user.uid);
                    }
                });
            }).catch(handleAuthError);
        }

        function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            const errBox = document.getElementById('auth-error');
            if(!email) { errBox.innerText = "Enter your email address first."; errBox.style.display = 'block'; return; }
            auth.sendPasswordResetEmail(email)
            .then(() => { errBox.innerText = "Reset email sent."; errBox.style.color = "var(--accent)"; errBox.style.display = 'block'; })
            .catch(handleAuthError);
        }

        function logout() { auth.signOut(); }

        // ROUTING FIX: Ensures no infinite loading if not in a room
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                document.getElementById('header-nav').style.display = 'flex';
                document.getElementById('user-nav').style.display = 'flex';
                
                db.ref('users/' + user.uid).on('value', snap => {
                    userProfile = snap.val();
                    
                    if(!userProfile) {
                        let fallbackUser = "user_" + Math.floor(Math.random() * 90000 + 10000);
                        const defaultAvatar = user.photoURL || 'https://api.dicebear.com/9.x/bottts-neutral/svg?seed=' + fallbackUser;
                        userProfile = { username: fallbackUser, displayName: user.displayName || "Player", photoURL: defaultAvatar, uid: user.uid, points: 0, bio: "", gender: "", country: "", dob: "", age: "" };
                        db.ref('users/' + user.uid).set(userProfile);
                        db.ref('usernames/' + fallbackUser).set(user.uid);
                    }
                    
                    document.getElementById('nav-username').innerText = userProfile.displayName || "Player";
                    document.getElementById('nav-avatar').src = userProfile.photoURL;
                    document.getElementById('nav-points').innerText = userProfile.points || 0;
                    
                    document.getElementById('edit-name').value = userProfile.displayName || "";
                    document.getElementById('edit-username').value = userProfile.username || "";
                    document.getElementById('edit-avatar-preview').src = userProfile.photoURL;
                    document.getElementById('edit-bio').value = userProfile.bio || "";
                    document.getElementById('edit-gender').value = userProfile.gender || "";
                    document.getElementById('edit-country').value = userProfile.country || "";
                    document.getElementById('edit-dob').value = userProfile.dob || "";
                    document.getElementById('edit-age').value = userProfile.age ? `${userProfile.age} yrs` : "";
                    base64Image = userProfile.photoURL || "";

                    // UNCONDITIONAL DASHBOARD ROUTING IF NO ACTIVE ROOM
                    if(currentRoomId === null) {
                        showScreen('screen-dashboard'); 
                        switchTab('play');
                    }
                });
            } else {
                currentUser = null; userProfile = null;
                document.getElementById('header-nav').style.display = 'none';
                document.getElementById('user-nav').style.display = 'none';
                document.getElementById('btn-action').innerText = "Sign In";
                showScreen('screen-auth');
            }
        });

        // Profile Management Functions
        function calculateAge() {
            const dobVal = document.getElementById('edit-dob').value;
            if(!dobVal) return;
            const dob = new Date(dobVal);
            const diff = Date.now() - dob.getTime();
            const ageDate = new Date(diff);
            const age = Math.abs(ageDate.getUTCFullYear() - 1970);
            document.getElementById('edit-age').value = `${age} yrs`;
        }

        function handleImageUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            if(file.size > 800000) return alert("File exceeds 800KB limits.");
            const reader = new FileReader();
            reader.onload = function(e) { base64Image = e.target.result; document.getElementById('edit-avatar-preview').src = base64Image; };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const newName = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const gender = document.getElementById('edit-gender').value;
            const country = document.getElementById('edit-country').value;
            const dob = document.getElementById('edit-dob').value;
            
            let ageNum = "";
            if(dob) {
                const ageVal = new Date(Date.now() - new Date(dob).getTime());
                ageNum = Math.abs(ageVal.getUTCFullYear() - 1970);
            }

            if(newName && currentUser) { 
                db.ref('users/' + currentUser.uid).update({ displayName: newName, photoURL: base64Image, bio: bio, gender: gender, country: country, dob: dob, age: ageNum }); 
                showNoti("Profile Updated."); 
            }
        }

        // Friends System Handlers
        function sendFriendRequest() {
            const target = document.getElementById('friend-search').value.trim().toLowerCase();
            if(!target) return;
            if(target === userProfile.username.toLowerCase()) return alert("Self-request is not permitted.");

            db.ref('usernames/' + target).once('value', snap => {
                if(snap.exists()) {
                    db.ref(`friendRequests/${snap.val()}/${currentUser.uid}`).set({ uid: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL });
                    showNoti("Request Sent."); document.getElementById('friend-search').value = "";
                } else alert("Target player not found.");
            });
        }

        function loadFriendsData() {
            if(!currentUser) return;
            db.ref(`friendRequests/${currentUser.uid}`).on('value', snap => {
                const reqBox = document.getElementById('requests-list'); reqBox.innerHTML = '';
                if(!snap.exists()) { reqBox.innerHTML = '<p style="font-size:0.85rem;color:var(--border);">No pending requests.</p>'; return; }
                snap.forEach(child => {
                    const req = child.val();
                    reqBox.innerHTML += `
                        <div class="list-item">
                            <div class="list-info"><img src="${req.photoURL}"> <div style="font-weight:600; font-size:0.9rem;">${req.username}</div></div>
                            <div style="display:flex; gap:5px;">
                                <button class="btn-outline" style="padding:4px 10px; border-color:var(--accent); color:var(--accent);" onclick="acceptRequest('${req.uid}', '${req.username}', '${req.photoURL}')">Accept</button>
                                <button class="btn-outline" style="padding:4px 10px; border-color:var(--danger); color:var(--danger);" onclick="rejectRequest('${req.uid}')">Reject</button>
                            </div>
                        </div>`;
                });
            });
            db.ref(`friends/${currentUser.uid}`).on('value', snap => {
                const friendBox = document.getElementById('friends-list'); friendBox.innerHTML = '';
                if(!snap.exists()) return;
                snap.forEach(child => {
                    const f = child.val();
                    friendBox.innerHTML += `<div class="list-item"><div class="list-info"><img src="${f.photoURL}"> <div style="font-weight:600; font-size:0.9rem;">${f.username}</div></div></div>`;
                });
            });
        }
        function acceptRequest(uid, username, photoURL) {
            db.ref(`friends/${currentUser.uid}/${uid}`).set({ uid, username, photoURL });
            db.ref(`friends/${uid}/${currentUser.uid}`).set({ uid: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL });
            rejectRequest(uid); showNoti("Friend Added.");
        }
        function rejectRequest(uid) { db.ref(`friendRequests/${currentUser.uid}/${uid}`).remove(); }

        // Matchmaking Engine
        function extractFlag(countryString) {
            if(!countryString) return "";
            return countryString.split(' ')[0] || "";
        }

        function createRoom() {
            if(!currentUser) return;
            const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            isBotMatch = false; pointsAwarded = false; matchType = "private";
            
            db.ref('rooms/' + roomId).set({
                board: ["", "", "", "", "", "", "", "", ""], turn: "X", status: "waiting", type: "private",
                playerX: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL, flag: extractFlag(userProfile.country) }
            }).then(() => { myRole = "X"; enterGameScreen(roomId); });
        }

        function findRandomMatch() {
            if(!currentUser) return;
            
            db.ref('rooms').orderByChild('status').equalTo('waiting').once('value', snap => {
                let foundRoom = null;
                if(snap.exists()) {
                    snap.forEach(child => {
                        let room = child.val();
                        if(room.type === "random" && room.playerX.id !== currentUser.uid) { foundRoom = child.key; return true; }
                    });
                }
                
                if(foundRoom) {
                    isBotMatch = false; pointsAwarded = false; matchType = "random"; myRole = "O";
                    db.ref('rooms/' + foundRoom).update({
                        status: "active",
                        playerO: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL, flag: extractFlag(userProfile.country) }
                    });
                    enterGameScreen(foundRoom);
                } else {
                    const roomId = "RND_" + Math.random().toString(36).substring(2, 8).toUpperCase();
                    isBotMatch = false; pointsAwarded = false; matchType = "random"; myRole = "X";
                    db.ref('rooms/' + roomId).set({
                        board: ["", "", "", "", "", "", "", "", ""], turn: "X", status: "waiting", type: "random",
                        playerX: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL, flag: extractFlag(userProfile.country) }
                    }).then(() => { enterGameScreen(roomId); });
                }
            });
        }

        function joinRoomFromInput() {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if(code) {
                db.ref('rooms/' + code).once('value', snap => {
                    const data = snap.val();
                    if(!data) return alert("Room not found.");
                    if(data.status !== "waiting" && data.playerX.id !== currentUser.uid) return alert("Room occupied or active.");
                    
                    isBotMatch = false; pointsAwarded = false; matchType = "private";
                    if(data.playerX.id !== currentUser.uid) {
                        myRole = "O";
                        db.ref('rooms/' + code).update({ status: "active", playerO: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL, flag: extractFlag(userProfile.country) } });
                    } else { myRole = "X"; }
                    enterGameScreen(code);
                });
            }
        }

        function copyInviteLink() { navigator.clipboard.writeText(currentRoomId); showNoti("Code Copied."); }

        function enterGameScreen(roomId) {
            currentRoomId = roomId;
            document.getElementById('room-display').innerText = matchType === "random" ? "RANDOM MATCH" : roomId;
            document.getElementById('copy-code-btn').style.display = (isBotMatch || matchType === "random") ? 'none' : 'block';
            document.getElementById('room-code-display').style.display = (isBotMatch || matchType === "random") ? 'none' : 'inline';
            
            document.getElementById('my-symbol').innerText = myRole;
            document.getElementById('my-name-game').innerText = userProfile.displayName;
            document.getElementById('my-avatar').src = userProfile.photoURL;
            document.getElementById('my-flag').innerText = extractFlag(userProfile.country);
            
            document.getElementById('end-actions').style.display = 'none';
            document.getElementById('chat-messages').innerHTML = '<div style="text-align: center; color: var(--border); font-size: 0.75rem;">Match chat initiated.</div>';
            document.getElementById('chat-col-wrapper').style.display = isBotMatch ? 'none' : 'flex';
            document.getElementById('hint-btn').style.display = isBotMatch ? 'block' : 'none';
            
            showScreen('screen-game');
            buildBoardUI();
            
            if(!isBotMatch) {
                if(currentRoomRef) currentRoomRef.off();
                currentRoomRef = db.ref('rooms/' + roomId);
                currentRoomRef.on('value', syncMultiplayerState);
                
                db.ref('rooms/' + roomId + '/chat').on('child_added', snap => {
                    const msg = snap.val(); const isSelf = msg.uid === currentUser.uid;
                    const chatBox = document.getElementById('chat-messages');
                    chatBox.innerHTML += `<div class="msg-item ${isSelf ? 'self' : ''}"><b>${isSelf ? 'Me' : msg.name}:</b> ${msg.msg}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
            }
        }

        function buildBoardUI() {
            const b = document.getElementById("board"); b.innerHTML = "";
            for(let i=0; i<9; i++) {
                const c = document.createElement("div"); c.className = "cell"; c.onclick = () => makeMove(i);
                b.appendChild(c);
            }
        }

        function syncMultiplayerState(snap) {
            const data = snap.val(); if(!data) return;
            localBoard = data.board || ["", "", "", "", "", "", "", "", ""];
            currentTurn = data.turn; gameActive = data.status === "active";

            const oppData = myRole === "X" ? data.playerO : data.playerX;
            document.getElementById('opp-name').innerText = oppData ? oppData.name : "Searching...";
            document.getElementById('opp-avatar').src = oppData ? oppData.photoURL : "https://api.dicebear.com/9.x/bottts-neutral/svg?seed=waiting";
            document.getElementById('opp-flag').innerText = oppData ? (oppData.flag || "") : "";
            
            if(data.status === "waiting") {
                document.getElementById('cancel-btn').style.display = 'block'; document.getElementById('resign-btn').style.display = 'none';
            } else if (gameActive) {
                document.getElementById('cancel-btn').style.display = 'none'; document.getElementById('resign-btn').style.display = 'block';
            }
            
            updateBoardVisuals(); updateTurnHighlight();
            if(data.status === "rematch_requested" && data.rematchBy !== currentUser.uid) { showNoti("Opponent requested rematch."); }

            if(data.status === "finished") {
                gameActive = false;
                document.getElementById('end-actions').style.display = 'flex';
                document.getElementById('cancel-btn').style.display = 'none'; document.getElementById('resign-btn').style.display = 'none';
                
                if(data.winner === currentUser.uid || data.winner === myRole + "_WIN") {
                    showNoti("Victory (+2 PTS)");
                    if(!pointsAwarded) { pointsAwarded = true; db.ref('users/' + currentUser.uid + '/points').transaction(c => (c || 0) + 2); }
                } else if(data.winner === "draw") { showNoti("Match Draw."); }
                else if(data.reason === "resigned" && data.winner !== currentUser.uid) { showNoti("Opponent Resigned."); }
                else if(data.reason === "resigned" && data.winner === currentUser.uid) { showNoti("Resigned Match."); }
                else { showNoti("Defeat."); }
            }
        }

        function makeMove(i) {
            if(!gameActive || currentTurn !== myRole || localBoard[i] !== "") return;
            localBoard[i] = myRole; updateBoardVisuals();
            
            let status = "active"; let winner = null;
            if(checkWin(localBoard, myRole)) { status = "finished"; winner = currentUser.uid; } 
            else if(!localBoard.includes("")) { status = "finished"; winner = "draw"; }

            if(isBotMatch) {
                currentTurn = myRole === "X" ? "O" : "X"; updateTurnHighlight();
                if(status === "finished") { handleBotGameOver(winner); return; }
                setTimeout(botMakeMove, 450); 
            } else {
                db.ref('rooms/' + currentRoomId).update({ board: localBoard, turn: myRole === "X" ? "O" : "X", status: status, ...(winner && {winner}) });
            }
        }

        function updateBoardVisuals() {
            const cells = document.querySelectorAll('.cell');
            localBoard.forEach((val, i) => { 
                if(val && cells[i].innerText !== val) { cells[i].innerText = val; cells[i].className = "cell " + val; }
                if(!val) { cells[i].innerText = ""; cells[i].className = "cell"; }
            });
        }
        function updateTurnHighlight() {
            document.getElementById('my-bar').classList.toggle('active-turn', currentTurn === myRole);
            document.getElementById('opp-bar').classList.toggle('active-turn', currentTurn !== myRole);
        }

        function checkWin(board, player) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => board[c[0]]===player && board[c[1]]===player && board[c[2]]===player);
        }

        function resignMatch() {
            if(!gameActive) return;
            if(isBotMatch) { handleBotGameOver("opp_win"); }
            else { db.ref('rooms/' + currentRoomId).update({ status: "finished", winner: myRole === "X" ? "O_WIN" : "X_WIN", reason: "resigned" }); }
        }
        function requestRematch() {
            if(isBotMatch) { startBotMatch(botDifficulty); return; }
            db.ref('rooms/' + currentRoomId).once('value', snap => {
                const data = snap.val();
                if(data.status === "rematch_requested" && data.rematchBy !== currentUser.uid) {
                    pointsAwarded = false; 
                    db.ref('rooms/' + currentRoomId).update({ board: ["", "", "", "", "", "", "", "", ""], turn: "X", status: "active", winner: null, reason: null });
                } else { db.ref('rooms/' + currentRoomId).update({ status: "rematch_requested", rematchBy: currentUser.uid }); showNoti("Rematch requested."); }
            });
        }
        function leaveMatch() {
            if(currentRoomRef) currentRoomRef.off(); 
            if(currentRoomId && !isBotMatch && gameActive) { db.ref('rooms/' + currentRoomId).update({ status: "finished", winner: myRole === "X" ? "O_WIN" : "X_WIN", reason: "resigned" }); }
            currentRoomId = null; showScreen('screen-dashboard'); switchTab('play');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input'); const msg = input.value.trim();
            if(!msg || !currentRoomId) return;
            db.ref('rooms/' + currentRoomId + '/chat').push({ uid: currentUser.uid, name: userProfile.displayName, msg: msg });
            input.value = "";
        }
        function sendEmoji(emoji) {
            if(!currentRoomId) return;
            db.ref('rooms/' + currentRoomId + '/chat').push({ uid: currentUser.uid, name: userProfile.displayName, msg: emoji });
        }

        // AI Engine Logic
        function startBotMatch(difficulty) {
            isBotMatch = true; botDifficulty = difficulty; pointsAwarded = false;
            currentRoomId = "BOT_ROOM"; myRole = "X"; currentTurn = "X"; gameActive = true;
            localBoard = ["", "", "", "", "", "", "", "", ""];
            
            enterGameScreen("BOT_MATCH");
            document.getElementById('room-display').innerText = difficulty.toUpperCase();
            document.getElementById('opp-symbol').innerText = "O";
            document.getElementById('opp-name').innerText = difficulty.toUpperCase() + " BOT";
            document.getElementById('opp-avatar').src = "https://api.dicebear.com/9.x/bottts-neutral/svg?seed=Bot" + difficulty;
            document.getElementById('opp-flag').innerText = "🤖";
            
            document.getElementById('end-actions').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'none';
            document.getElementById('resign-btn').style.display = 'block';
            updateTurnHighlight();
        }

        function showHint() {
            if(!isBotMatch || currentTurn !== myRole || !gameActive) return;
            let move = getBestMove(localBoard, myRole);
            const cells = document.querySelectorAll('.cell');
            cells[move].classList.add('hint-anim');
            setTimeout(() => cells[move].classList.remove('hint-anim'), 1000);
        }

        function botMakeMove() {
            if(!gameActive) return;
            let moveIndex = -1; const botPlayer = myRole === "X" ? "O" : "X";
            
            let rand = 0;
            if(botDifficulty === 'beginner') rand = 0.8; 
            if(botDifficulty === 'intermediate') rand = 0.4; 
            if(botDifficulty === 'pro') rand = 0.15; 
            if(botDifficulty === 'legend') rand = 0.05; 
            if(botDifficulty === 'immortal') rand = 0.0; 

            if(Math.random() < rand) {
                let empty = []; localBoard.forEach((v, i) => { if(v === "") empty.push(i); });
                moveIndex = empty[Math.floor(Math.random() * empty.length)];
            } else { moveIndex = getBestMove(localBoard, botPlayer); }

            localBoard[moveIndex] = botPlayer; updateBoardVisuals();

            if(checkWin(localBoard, botPlayer)) { handleBotGameOver("BOT"); }
            else if(!localBoard.includes("")) { handleBotGameOver("draw"); }
            else { currentTurn = myRole; updateTurnHighlight(); }
        }

        function handleBotGameOver(winner) {
            gameActive = false;
            document.getElementById('end-actions').style.display = 'flex';
            document.getElementById('resign-btn').style.display = 'none';
            
            if(winner === "draw") showNoti("Match Draw.");
            else if(winner === "opp_win") showNoti("Resigned.");
            else if(winner === "BOT") showNoti("Defeat.");
            else { showNoti("Victory."); }
        }

        function getBestMove(board, player) {
            let bestScore = -Infinity; let move = -1;
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = player;
                    let score = minimax(board, 0, false, player);
                    board[i] = "";
                    if(score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(board, depth, isMaximizing, botPlayer) {
            const humanPlayer = botPlayer === "X" ? "O" : "X";
            if(checkWin(board, botPlayer)) return 10 - depth;
            if(checkWin(board, humanPlayer)) return depth - 10;
            if(!board.includes("")) return 0;

            if(isMaximizing) {
                let bestScore = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = botPlayer;
                        bestScore = Math.max(bestScore, minimax(board, depth + 1, false, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = humanPlayer;
                        bestScore = Math.min(bestScore, minimax(board, depth + 1, true, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            }
        }
    </script>
</body>
