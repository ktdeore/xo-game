<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Infinite</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Real Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #0d1117; --bg-panel: #161b22; --bg-input: #010409;
            --text-main: #c9d1d9; --text-muted: #8b949e;
            --accent: #238636; --accent-hover: #2ea043;
            --danger: #da3633; --border: #30363d;
            --x-color: #58a6ff; --o-color: #ff7b72;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; width: 100%; padding: 20px; overflow-y: auto; padding-top: 80px; }
        .active-screen { display: flex; }

        /* Header & Nav */
        .header { width: 100%; padding: 15px 20px; background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; z-index: 100; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
        
        .user-nav { display: flex; align-items: center; gap: 15px; display: none; }
        .nav-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; object-fit: cover;}
        
        /* Tabs */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; background: var(--bg-panel); padding: 5px; border-radius: 8px; width: 100%; max-width: 500px; justify-content: center;}
        .tab-btn { padding: 10px 15px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600; border-radius: 6px; transition: 0.2s; }
        .tab-btn.active { background: var(--border); color: #fff; }

        /* UI Elements */
        .card { background: var(--bg-panel); padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-input); color: #fff; outline: none; }
        .input-group input:focus { border-color: var(--x-color); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--border); }
        .btn-danger { background: var(--danger); }
        
        /* Error parsing */
        .error-msg { background: rgba(218, 54, 51, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; border: 1px solid rgba(218, 54, 51, 0.3); }
        
        /* Lists (Friends, Requests) */
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
        .list-info { display: flex; align-items: center; gap: 10px; }
        .list-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .action-btns { display: flex; gap: 5px; }
        .btn-small { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; color: white;}

        /* Game Board */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 400px; aspect-ratio: 1; background: var(--border); gap: 4px; border: 4px solid var(--border); border-radius: 8px; margin: 20px 0; }
        .cell { background: var(--bg-main); display: flex; justify-content: center; align-items: center; font-size: 5rem; font-weight: 700; cursor: pointer; user-select: none;}
        .cell.X { color: var(--x-color); } .cell.O { color: var(--o-color); }
        .player-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; background: var(--bg-panel); padding: 10px 15px; border-radius: 8px; margin: 5px 0; border: 2px solid transparent; }
        .active-turn { border-color: var(--accent); }

        .notification { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--x-color); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 700; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div id="noti" class="notification">Message</div>

    <div class="header">
        <h1>XO INFINITE</h1>
        <div class="user-nav" id="user-nav">
            <div style="text-align: right; line-height: 1.2;">
                <div id="nav-username" style="font-weight: 700; color: #fff;">User</div>
                <div id="nav-tag" style="font-size: 0.75rem; color: var(--text-muted);">@tag</div>
            </div>
            <img id="nav-avatar" class="nav-avatar" src="https://ui-avatars.com/api/?name=User" onclick="switchTab('profile')">
        </div>
    </div>

    <!-- 1. AUTH SCREEN -->
    <div id="screen-auth" class="screen active-screen" style="justify-content: center; padding-top: 20px;">
        <div class="card">
            <h2 id="auth-title" style="text-align: center; margin-bottom: 20px;">Log In</h2>
            <div id="auth-error" class="error-msg"></div>
            
            <div id="signup-fields" style="display: none;">
                <div class="input-group"><input type="text" id="reg-username" placeholder="Choose a Username (e.g. pro_gamer)"></div>
            </div>
            
            <div class="input-group"><input type="email" id="email" placeholder="Email Address"></div>
            <div class="input-group"><input type="password" id="password" placeholder="Password"></div>
            
            <button class="btn" id="btn-action" onclick="processAuth()">Log In</button>
            <div style="text-align: center; margin-top: 15px; font-size: 0.9rem; cursor: pointer; color: var(--x-color);" onclick="toggleAuthMode()" id="toggle-auth-text">Don't have an account? Sign Up</div>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD (Tabs) -->
    <div id="screen-dashboard" class="screen">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('play')" id="tab-play">Play</button>
            <button class="tab-btn" onclick="switchTab('bots')" id="tab-bots">Bots</button>
            <button class="tab-btn" onclick="switchTab('friends')" id="tab-friends">Friends</button>
            <button class="tab-btn" onclick="switchTab('profile')" id="tab-profile">Profile</button>
        </div>

        <!-- PLAY TAB -->
        <div id="view-play" class="card tab-view">
            <h3 style="margin-bottom: 15px;">Live Multiplayer</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Create a room or join with a code.</p>
            <button class="btn" onclick="createRoom()">Create Room (Live)</button>
            
            <div style="margin: 20px 0; border-top: 1px solid var(--border); padding-top: 20px;">
                <input type="text" id="join-code" placeholder="Enter Room Code" style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 10px;">
                <button class="btn btn-outline" onclick="joinRoomFromInput()">Join Room</button>
            </div>
        </div>

        <!-- BOTS TAB -->
        <div id="view-bots" class="card tab-view" style="display: none;">
            <h3 style="margin-bottom: 15px;">Practice vs Bots</h3>
            <button class="btn btn-outline" style="border-color: #2ea043; color: #2ea043;" onclick="startBotMatch('beginner')">Beginner Bot</button>
            <button class="btn btn-outline" style="border-color: #58a6ff; color: #58a6ff;" onclick="startBotMatch('intermediate')">Intermediate Bot</button>
            <button class="btn btn-outline" style="border-color: #d2a8ff; color: #d2a8ff;" onclick="startBotMatch('pro')">Pro Bot</button>
            <button class="btn btn-outline" style="border-color: #ff7b72; color: #ff7b72;" onclick="startBotMatch('legend')">Legend Bot</button>
            <button class="btn" style="background: linear-gradient(90deg, #da3633, #8a2be2);" onclick="startBotMatch('immortal')">Immortal Bot (Unbeatable)</button>
        </div>

        <!-- FRIENDS TAB -->
        <div id="view-friends" class="card tab-view" style="display: none; max-width: 500px;">
            <h3 style="margin-bottom: 15px;">Add Friends ➕</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="friend-search" placeholder="Enter Username..." style="flex: 1; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 6px;">
                <button class="btn" style="width: auto; margin: 0;" onclick="sendFriendRequest()">Send</button>
            </div>

            <h4 style="margin: 15px 0 10px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 5px;">Pending Requests</h4>
            <div id="requests-list">
                <!-- Dynamically populated -->
                <p style="font-size: 0.85rem; color: var(--text-muted);">No pending requests.</p>
            </div>

            <h4 style="margin: 25px 0 10px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 5px;">My Friends</h4>
            <div id="friends-list">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- PROFILE TAB -->
        <div id="view-profile" class="card tab-view" style="display: none;">
            <h3 style="margin-bottom: 15px;">Edit Profile</h3>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="edit-avatar-preview" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border); object-fit: cover; margin-bottom: 10px;">
                <input type="text" id="edit-avatar-url" placeholder="Paste Image URL here..." style="width: 100%; padding: 8px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.8rem;">
            </div>

            <label style="font-size: 0.8rem; color: var(--text-muted);">Display Name</label>
            <div class="input-group"><input type="text" id="edit-name" placeholder="Display Name"></div>
            
            <label style="font-size: 0.8rem; color: var(--text-muted);">Username (Unique)</label>
            <div class="input-group"><input type="text" id="edit-username" placeholder="username" disabled style="opacity: 0.6;"></div>
            
            <button class="btn" onclick="saveProfile()">Save Changes</button>
            <button class="btn btn-outline btn-danger" style="margin-top: 20px;" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- 3. GAME SCREEN -->
    <div id="screen-game" class="screen" style="justify-content: center;">
        <div style="width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span id="room-display" style="color: var(--text-muted); font-weight: 600;">ROOM: ---</span>
            <span id="copy-code-btn" onclick="copyInviteLink()" style="color: var(--x-color); cursor: pointer; font-size: 0.85rem; font-weight: 700;">Copy Code</span>
        </div>

        <div class="player-bar" id="opp-bar">
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Opponent (<span id="opp-symbol">O</span>)</div>
                <div id="opp-name" style="font-weight: 700;">Waiting...</div>
            </div>
            <img id="opp-avatar" src="https://ui-avatars.com/api/?name=O" style="width:30px; height:30px; border-radius:50%;">
        </div>

        <div class="board" id="board"></div>

        <div class="player-bar" id="my-bar">
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">You (<span id="my-symbol">X</span>)</div>
                <div id="my-name-game" style="font-weight: 700;">Me</div>
            </div>
            <img id="my-avatar" src="https://ui-avatars.com/api/?name=X" style="width:30px; height:30px; border-radius:50%;">
        </div>

        <button class="btn btn-danger" style="max-width: 400px; margin-top: 25px;" onclick="leaveMatch()">Resign / Leave</button>
    </div>

    <script>
        // =========================================================================
        // STRICT FIREBASE CONFIGURATION (Provided by User)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyARdbrN_3V1Uk6KJ9JbHa6PJmv5Xtfv9Fw",
            authDomain: "xo-play-e654f.firebaseapp.com",
            databaseURL: "https://xo-play-e654f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xo-play-e654f",
            storageBucket: "xo-play-e654f.firebasestorage.app",
            messagingSenderId: "745980316574",
            appId: "1:745980316574:web:c9e34f46be9fb4c853648f",
            measurementId: "G-82TTJV08M8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // App State
        let currentUser = null; 
        let userProfile = null;
        
        // Game State
        let currentRoomId = null; 
        let myRole = null; 
        let gameActive = false;
        let currentTurn = 'X'; 
        let currentRoomRef = null;
        let localBoard = ["", "", "", "", "", "", "", "", ""];
        
        // Bot State
        let isBotMatch = false;
        let botDifficulty = '';

        // Helpers
        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen')); document.getElementById(id).classList.add('active-screen'); }
        function showNoti(msg) { const noti = document.getElementById('noti'); noti.innerText = msg; noti.style.display = 'block'; setTimeout(() => noti.style.display = 'none', 3000); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${tabId}`).style.display = 'block';
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if(tabId === 'friends') loadFriendsData();
        }

        // ==========================================
        // 1. AUTHENTICATION & ERROR PARSING
        // ==========================================
        let isLoginMode = true;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Log In" : "Create Account";
            document.getElementById('btn-action').innerText = isLoginMode ? "Log In" : "Sign Up";
            document.getElementById('toggle-auth-text').innerText = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Log In";
            document.getElementById('signup-fields').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('auth-error').style.display = 'none';
        }

        function processAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const errBox = document.getElementById('auth-error');
            
            if(!email || !pass) { errBox.innerText = "Please fill all fields."; errBox.style.display = 'block'; return; }
            if(!isLoginMode && !username) { errBox.innerText = "Username is required."; errBox.style.display = 'block'; return; }

            document.getElementById('btn-action').innerText = "Processing...";

            if(isLoginMode) {
                auth.signInWithEmailAndPassword(email, pass).catch(handleAuthError);
            } else {
                // Check if username is taken
                db.ref('usernames/' + username).once('value', snap => {
                    if(snap.exists()) {
                        errBox.innerText = "Username already taken!"; errBox.style.display = 'block';
                        document.getElementById('btn-action').innerText = "Sign Up";
                    } else {
                        auth.createUserWithEmailAndPassword(email, pass)
                        .then(cred => {
                            const defaultAvatar = `https://ui-avatars.com/api/?name=${username}&background=random`;
                            db.ref('users/' + cred.user.uid).set({
                                username: username, displayName: username, photoURL: defaultAvatar, uid: cred.user.uid
                            });
                            db.ref('usernames/' + username).set(cred.user.uid);
                        }).catch(handleAuthError);
                    }
                });
            }
        }

        // 🔴 FIX FOR UGLY JSON ERROR (image_9ebd96.png)
        function handleAuthError(error) {
            const errBox = document.getElementById('auth-error');
            let cleanMsg = error.message; // Fallback
            
            // Map Firebase Auth Error Codes to Human Readable Text
            if (error.code === 'auth/invalid-login-credentials' || error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                cleanMsg = "Incorrect Email or Password. Please try again.";
            } else if (error.code === 'auth/user-not-found') {
                cleanMsg = "No account found with this email.";
            } else if (error.code === 'auth/email-already-in-use') {
                cleanMsg = "This email is already registered.";
            }

            errBox.innerText = cleanMsg;
            errBox.style.display = 'block';
            document.getElementById('btn-action').innerText = isLoginMode ? "Log In" : "Sign Up";
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                // Fetch User Profile
                db.ref('users/' + user.uid).on('value', snap => {
                    userProfile = snap.val();
                    if(!userProfile) return;
                    
                    document.getElementById('nav-username').innerText = userProfile.displayName;
                    document.getElementById('nav-tag').innerText = "@" + userProfile.username;
                    document.getElementById('nav-avatar').src = userProfile.photoURL;
                    
                    // Populate Profile Tab
                    document.getElementById('edit-name').value = userProfile.displayName;
                    document.getElementById('edit-username').value = userProfile.username;
                    document.getElementById('edit-avatar-url').value = userProfile.photoURL;
                    document.getElementById('edit-avatar-preview').src = userProfile.photoURL;
                });
                
                document.getElementById('user-nav').style.display = 'flex';
                showScreen('screen-dashboard');
            } else {
                currentUser = null; userProfile = null;
                document.getElementById('user-nav').style.display = 'none';
                showScreen('screen-auth');
            }
        });

        // ==========================================
        // 2. PROFILE & FRIENDS SYSTEM
        // ==========================================
        function saveProfile() {
            const newName = document.getElementById('edit-name').value.trim();
            const newAvatar = document.getElementById('edit-avatar-url').value.trim();
            if(newName && currentUser) {
                db.ref('users/' + currentUser.uid).update({ displayName: newName, photoURL: newAvatar });
                showNoti("Profile Updated!");
            }
        }

        function sendFriendRequest() {
            const targetUsername = document.getElementById('friend-search').value.trim().toLowerCase();
            if(!targetUsername || targetUsername === userProfile.username) return;

            db.ref('usernames/' + targetUsername).once('value', snap => {
                if(snap.exists()) {
                    const targetUid = snap.val();
                    db.ref(`friendRequests/${targetUid}/${currentUser.uid}`).set({
                        uid: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL, timestamp: Date.now()
                    });
                    showNoti("Friend Request Sent!");
                    document.getElementById('friend-search').value = "";
                } else {
                    alert("User not found!");
                }
            });
        }

        function loadFriendsData() {
            if(!currentUser) return;
            
            // Load Requests
            db.ref(`friendRequests/${currentUser.uid}`).on('value', snap => {
                const reqBox = document.getElementById('requests-list');
                reqBox.innerHTML = '';
                if(!snap.exists()) { reqBox.innerHTML = '<p style="font-size:0.85rem;color:var(--text-muted);">No pending requests.</p>'; return; }
                
                snap.forEach(child => {
                    const req = child.val();
                    reqBox.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <img src="${req.photoURL}">
                                <div><div style="font-weight:600;font-size:0.9rem;">${req.username}</div></div>
                            </div>
                            <div class="action-btns">
                                <button class="btn-small" style="background:var(--accent);" onclick="acceptRequest('${req.uid}', '${req.username}', '${req.photoURL}')">Accept</button>
                                <button class="btn-small" style="background:var(--danger);" onclick="rejectRequest('${req.uid}')">✖</button>
                            </div>
                        </div>`;
                });
            });

            // Load Friends
            db.ref(`friends/${currentUser.uid}`).on('value', snap => {
                const friendBox = document.getElementById('friends-list');
                friendBox.innerHTML = '';
                if(!snap.exists()) { friendBox.innerHTML = '<p style="font-size:0.85rem;color:var(--text-muted);">Add friends to see them here.</p>'; return; }
                
                snap.forEach(child => {
                    const f = child.val();
                    friendBox.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <img src="${f.photoURL}">
                                <div><div style="font-weight:600;font-size:0.9rem;">${f.username}</div></div>
                            </div>
                        </div>`;
                });
            });
        }

        function acceptRequest(uid, username, photoURL) {
            // Add to my friends
            db.ref(`friends/${currentUser.uid}/${uid}`).set({ uid, username, photoURL });
            // Add me to their friends
            db.ref(`friends/${uid}/${currentUser.uid}`).set({ uid: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL });
            // Remove request
            rejectRequest(uid);
            showNoti("Friend Added ➕");
        }
        function rejectRequest(uid) { db.ref(`friendRequests/${currentUser.uid}/${uid}`).remove(); }

        // ==========================================
        // 3. MULTIPLAYER ENGINE
        // ==========================================
        function createRoom() {
            if(!currentUser) return;
            const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            isBotMatch = false;
            
            db.ref('rooms/' + roomId).set({
                board: ["", "", "", "", "", "", "", "", ""], turn: "X", status: "waiting",
                playerX: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL }
            }).then(() => {
                myRole = "X"; enterGameScreen(roomId);
            });
        }

        function joinRoomFromInput() {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if(code) {
                db.ref('rooms/' + code).once('value', snap => {
                    const data = snap.val();
                    if(!data) { alert("Invalid Room Code"); return; }
                    if(data.status !== "waiting" && data.playerX.id !== currentUser.uid) { alert("Room Full or Active"); return; }
                    
                    isBotMatch = false;
                    if(data.playerX.id !== currentUser.uid) {
                        myRole = "O";
                        db.ref('rooms/' + code).update({
                            status: "active",
                            playerO: { id: currentUser.uid, name: userProfile.displayName, photoURL: userProfile.photoURL }
                        });
                    } else { myRole = "X"; }
                    enterGameScreen(code);
                });
            }
        }

        function copyInviteLink() { navigator.clipboard.writeText(currentRoomId); showNoti("Room Code Copied!"); }

        function leaveMatch() {
            if(currentRoomRef) currentRoomRef.off(); 
            if(currentRoomId && !isBotMatch && gameActive) {
                db.ref('rooms/' + currentRoomId).update({ status: "finished", winner: myRole === "X" ? "O_WIN" : "X_WIN" }); 
            }
            currentRoomId = null; showScreen('screen-dashboard');
        }

        function enterGameScreen(roomId) {
            currentRoomId = roomId;
            document.getElementById('room-display').innerText = "ROOM: " + roomId;
            document.getElementById('copy-code-btn').style.display = isBotMatch ? 'none' : 'block';
            
            document.getElementById('my-symbol').innerText = myRole;
            document.getElementById('my-name-game').innerText = userProfile.displayName;
            document.getElementById('my-avatar').src = userProfile.photoURL;
            
            showScreen('screen-game');
            buildBoardUI();
            
            if(!isBotMatch) {
                if(currentRoomRef) currentRoomRef.off();
                currentRoomRef = db.ref('rooms/' + roomId);
                currentRoomRef.on('value', syncMultiplayerState);
            }
        }

        function buildBoardUI() {
            const b = document.getElementById("board"); b.innerHTML = "";
            for(let i=0; i<9; i++) {
                const c = document.createElement("div"); c.className = "cell"; c.onclick = () => makeMove(i);
                b.appendChild(c);
            }
        }

        function syncMultiplayerState(snap) {
            const data = snap.val(); if(!data) return;
            localBoard = data.board || ["", "", "", "", "", "", "", "", ""];
            currentTurn = data.turn; gameActive = data.status === "active";

            const oppData = myRole === "X" ? data.playerO : data.playerX;
            document.getElementById('opp-name').innerText = oppData ? oppData.name : "Waiting...";
            document.getElementById('opp-avatar').src = oppData ? oppData.photoURL : "https://ui-avatars.com/api/?name=O";
            
            updateBoardVisuals();

            if(data.status === "finished") {
                gameActive = false;
                if(data.winner === "draw") showNoti("Match Draw! 🤝");
                else if(data.winner === currentUser.uid || data.winner === myRole + "_WIN") showNoti("You Won! 🎉");
                else showNoti("You Lost! 💀");
            }
            updateTurnHighlight();
        }

        function makeMove(i) {
            if(!gameActive || currentTurn !== myRole || localBoard[i] !== "") return;
            
            localBoard[i] = myRole;
            updateBoardVisuals();
            
            let status = "active"; let winner = null;
            if(checkWin(localBoard, myRole)) { status = "finished"; winner = currentUser.uid; } 
            else if(!localBoard.includes("")) { status = "finished"; winner = "draw"; }

            if(isBotMatch) {
                currentTurn = myRole === "X" ? "O" : "X";
                updateTurnHighlight();
                if(status === "finished") { handleBotGameOver(winner); return; }
                setTimeout(botMakeMove, 500); // Bot delay
            } else {
                db.ref('rooms/' + currentRoomId).update({
                    board: localBoard, turn: myRole === "X" ? "O" : "X", status: status, ...(winner && {winner})
                });
            }
        }

        function updateBoardVisuals() {
            const cells = document.querySelectorAll('.cell');
            localBoard.forEach((val, i) => {
                cells[i].innerText = val;
                cells[i].className = "cell " + val;
            });
        }
        
        function updateTurnHighlight() {
            document.getElementById('my-bar').classList.toggle('active-turn', currentTurn === myRole);
            document.getElementById('opp-bar').classList.toggle('active-turn', currentTurn !== myRole);
        }

        function checkWin(board, player) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => board[c[0]]===player && board[c[1]]===player && board[c[2]]===player);
        }

        // ==========================================
        // 4. THE AI BOT ENGINE (Minimax & Randomizer)
        // ==========================================
        function startBotMatch(difficulty) {
            isBotMatch = true; botDifficulty = difficulty;
            currentRoomId = "BOT_ROOM"; myRole = "X"; currentTurn = "X"; gameActive = true;
            localBoard = ["", "", "", "", "", "", "", "", ""];
            
            document.getElementById('opp-symbol').innerText = "O";
            document.getElementById('opp-name').innerText = difficulty.toUpperCase() + " BOT 🤖";
            document.getElementById('opp-avatar').src = "https://ui-avatars.com/api/?name=Bot&background=da3633&color=fff";
            
            enterGameScreen("BOT_MATCH");
            updateTurnHighlight();
        }

        function botMakeMove() {
            if(!gameActive) return;
            let moveIndex = -1;
            const botPlayer = myRole === "X" ? "O" : "X";
            
            // Randomness factor based on difficulty
            let randomChance = 0;
            if(botDifficulty === 'beginner') randomChance = 1.0; // 100% random
            if(botDifficulty === 'intermediate') randomChance = 0.5; // 50% random
            if(botDifficulty === 'pro') randomChance = 0.2; // 20% random
            if(botDifficulty === 'legend') randomChance = 0.05; // 5% random
            if(botDifficulty === 'immortal') randomChance = 0.0; // 0% random (Unbeatable)

            if(Math.random() < randomChance) {
                // Random Move
                let empty = [];
                localBoard.forEach((v, i) => { if(v === "") empty.push(i); });
                moveIndex = empty[Math.floor(Math.random() * empty.length)];
            } else {
                // Optimal Minimax Move
                moveIndex = getBestMove(localBoard, botPlayer);
            }

            localBoard[moveIndex] = botPlayer;
            updateBoardVisuals();

            if(checkWin(localBoard, botPlayer)) { handleBotGameOver("BOT"); }
            else if(!localBoard.includes("")) { handleBotGameOver("draw"); }
            else { currentTurn = myRole; updateTurnHighlight(); }
        }

        function handleBotGameOver(winner) {
            gameActive = false;
            if(winner === "draw") showNoti("Match Draw! 🤝");
            else if(winner === "BOT") showNoti("Bot Won! 💀");
            else showNoti("You Won! 🎉");
        }

        // --- Unbeatable Minimax Algorithm ---
        function getBestMove(board, player) {
            let bestScore = -Infinity; let move = -1;
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = player;
                    let score = minimax(board, 0, false, player);
                    board[i] = "";
                    if(score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(board, depth, isMaximizing, botPlayer) {
            const humanPlayer = botPlayer === "X" ? "O" : "X";
            if(checkWin(board, botPlayer)) return 10 - depth;
            if(checkWin(board, humanPlayer)) return depth - 10;
            if(!board.includes("")) return 0;

            if(isMaximizing) {
                let bestScore = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = botPlayer;
                        bestScore = Math.max(bestScore, minimax(board, depth + 1, false, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = humanPlayer;
                        bestScore = Math.min(bestScore, minimax(board, depth + 1, true, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            }
        }
    </script>
