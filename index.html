<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XO Infinite - Professional</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #09090b; --bg-panel: #18181b; --bg-input: #27272a;
            --text-main: #f4f4f5; --text-muted: #a1a1aa;
            --accent: #22c55e; --accent-hover: #16a34a;
            --danger: #ef4444; --danger-hover: #dc2626;
            --border: #3f3f46;
            --x-color: #3b82f6; --o-color: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseHint { 0% { box-shadow: inset 0 0 0 0 rgba(34, 197, 94, 0.7); } 50% { box-shadow: inset 0 0 20px 5px rgba(34, 197, 94, 0.9); } 100% { box-shadow: inset 0 0 0 0 rgba(34, 197, 94, 0); } }

        /* Header Navigation */
        .header { height: 70px; width: 100%; padding: 0 30px; background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon { width: 32px; height: 32px; fill: none; stroke: var(--text-main); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .header h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; margin-top: 2px;}
        
        .desktop-nav { display: flex; gap: 20px; flex: 1; justify-content: center; display: none; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 5px 10px; transition: 0.2s; border-bottom: 2px solid transparent; }
        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { color: #fff; border-bottom-color: var(--accent); }

        .user-nav { display: flex; align-items: center; gap: 15px; display: none; }
        .points-badge { background: rgba(34, 197, 94, 0.15); color: var(--accent); border: 1px solid rgba(34, 197, 94, 0.3); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px;}
        .nav-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; object-fit: cover; transition: 0.2s;}
        .nav-avatar:hover { border-color: var(--text-muted); }

        /* Main Area */
        .main-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 550px; animation: fadeIn 0.3s ease-out; }
        .active-screen { display: flex; }

        /* UI Cards & Inputs */
        .card { background: var(--bg-panel); padding: 30px; border-radius: 12px; width: 100%; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; width: 100%; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: #fff; outline: none; transition: 0.2s; font-family: 'Inter', sans-serif;}
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--x-color); }
        .input-group textarea { resize: vertical; min-height: 80px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; font-size: 0.95rem;}
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-input); border-color: var(--text-muted); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-random { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-random:hover { background: linear-gradient(135deg, #4f46e5, #9333ea); transform: translateY(-2px); }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
        .list-info { display: flex; align-items: center; gap: 12px; }
        .list-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        /* Game Screen Layout (PC vs Mobile) */
        .game-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 450px; }
        .board-col { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .chat-col { display: flex; flex-direction: column; width: 100%; height: 280px; }

        @media (min-width: 850px) {
            .desktop-nav { display: flex; }
            .screen { max-width: 1000px; }
            .game-layout { flex-direction: row; max-width: 900px; align-items: flex-start; justify-content: center; gap: 40px;}
            .board-col { width: 400px; }
            .chat-col { width: 350px; height: 500px; margin-top: 45px;}
        }

        /* Board & Player Bars */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; aspect-ratio: 1; background: var(--border); gap: 4px; border: 4px solid var(--border); border-radius: 12px; margin: 15px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .cell { background: var(--bg-main); display: flex; justify-content: center; align-items: center; font-size: 5.5rem; font-family: 'Outfit', sans-serif; font-weight: 800; cursor: pointer; user-select: none; transition: 0.1s;}
        .cell:hover { background: var(--bg-input); }
        .cell.X { color: var(--x-color); animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); } 
        .cell.O { color: var(--o-color); animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hint-anim { animation: pulseHint 1s ease-out; }

        .player-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--bg-panel); padding: 12px 20px; border-radius: 10px; border: 2px solid transparent; transition: 0.3s; }
        .active-turn { border-color: var(--accent); background: rgba(34, 197, 94, 0.05); }
        .player-flag { margin-left: 5px; font-size: 1.1rem; }

        /* Chat System */
        .chat-box { width: 100%; height: 100%; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; }
        .msg-item { background: var(--bg-input); padding: 8px 12px; border-radius: 8px; width: fit-content; max-width: 85%; word-break: break-word; line-height: 1.4; }
        .msg-item.self { background: var(--border); align-self: flex-end; }
        
        .chat-quick-emojis { display: flex; justify-content: space-around; padding: 8px; border-top: 1px solid var(--border); background: var(--bg-input); }
        .emoji-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .emoji-btn:hover { transform: scale(1.2); }
        
        .chat-input-area { display: flex; border-top: 1px solid var(--border); background: var(--bg-main); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px 15px; outline: none; font-size: 0.9rem;}
        .chat-input-area button { background: transparent; color: var(--x-color); border: none; padding: 0 15px; cursor: pointer; font-weight: 600; }

        /* Notification & Loader */
        .notification { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-main); padding: 12px 25px; border-radius: 8px; font-weight: 700; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-align: center; }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; border: 1px solid rgba(239, 68, 68, 0.3); }

        .loader { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* File Upload */
        .file-upload-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; cursor: pointer; }
        .file-upload-wrapper img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); transition: 0.2s; }
        .file-upload-wrapper:hover img { opacity: 0.7; }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-badge { position: absolute; bottom: 0; right: 0; background: var(--border); padding: 5px; border-radius: 50%; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="noti" class="notification">Message</div>

    <!-- TOP HEADER -->
    <div class="header">
        <div class="logo-area" onclick="if(currentUser) switchTab('play')">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M4 4l16 16M4 20L20 4"></path>
            </svg>
            <h1>XO INFINITE</h1>
        </div>
        
        <div class="desktop-nav" id="desktop-nav">
            <button class="nav-btn active" onclick="switchTab('play')" id="nav-play">Play</button>
            <button class="nav-btn" onclick="switchTab('bots')" id="nav-bots">Practice</button>
            <button class="nav-btn" onclick="switchTab('friends')" id="nav-friends">Friends</button>
            <button class="nav-btn" onclick="switchTab('profile')" id="nav-profile">Profile</button>
        </div>

        <div class="user-nav" id="user-nav">
            <div class="points-badge" title="Total Points">🏆 <span id="nav-points">0</span></div>
            <img id="nav-avatar" class="nav-avatar" src="" onclick="switchTab('profile')">
        </div>
    </div>

    <div class="main-area">
        <!-- 0. LOADING SCREEN -->
        <div id="screen-loading" class="screen active-screen" style="justify-content: center;">
            <div class="loader"></div>
            <h3 style="color: var(--text-muted); font-weight: 500;">Connecting...</h3>
        </div>

        <!-- 1. AUTH SCREEN -->
        <div id="screen-auth" class="screen" style="justify-content: center; max-width: 450px;">
            <div class="card">
                <h2 id="auth-title" style="text-align: center; margin-bottom: 25px; font-weight: 700;">Log In</h2>
                <div id="auth-error" class="error-msg"></div>
                
                <div id="signup-fields" style="display: none;">
                    <div class="input-group"><input type="text" id="reg-username" placeholder="Username (Min 3 letters/numbers)"></div>
                </div>
                
                <div class="input-group"><input type="email" id="email" placeholder="Email Address"></div>
                <div class="input-group"><input type="password" id="password" placeholder="Password"></div>
                
                <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
                    <span style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'" onclick="handleForgotPassword()">Forgot Password?</span>
                </div>
                
                <button class="btn" id="btn-action" onclick="processAuth()">Log In</button>
                <div style="text-align: center; margin: 15px 0; font-size: 0.9rem; cursor: pointer; color: var(--text-muted);" onclick="toggleAuthMode()" id="toggle-auth-text">Don't have an account? <span style="color:var(--x-color); font-weight: 600;">Sign Up</span></div>
                
                <div style="text-align: center; margin: 15px 0; color: var(--border); font-size: 0.85rem;">OR</div>
                
                <button class="btn" style="background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px;" onclick="loginWithGoogle()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google"> Continue with Google
                </button>
            </div>
        </div>

        <!-- 2. MAIN DASHBOARD -->
        <div id="screen-dashboard" class="screen">
            <!-- PLAY TAB -->
            <div id="view-play" class="card tab-view">
                <h3 style="margin-bottom: 15px;">Global Matchmaking</h3>
                <button class="btn btn-random" onclick="findRandomMatch()">🌍 Play Random Player</button>
                
                <h3 style="margin: 25px 0 15px; border-top: 1px solid var(--border); padding-top: 25px;">Play with Friends</h3>
                <button class="btn btn-outline" onclick="createRoom()">Host Private Room</button>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <input type="text" id="join-code" placeholder="Enter Room Code" style="flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; text-transform: uppercase;">
                    <button class="btn btn-outline" style="width: auto; margin: 0; padding: 0 20px;" onclick="joinRoomFromInput()">Join</button>
                </div>
            </div>

            <!-- BOTS TAB -->
            <div id="view-bots" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 20px;">Practice vs AI</h3>
                <button class="btn btn-outline" onclick="startBotMatch('beginner')">Beginner Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('intermediate')">Intermediate Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('pro')">Pro Bot</button>
                <button class="btn btn-outline" onclick="startBotMatch('legend')">Legend Bot</button>
                <button class="btn" style="background: var(--text-main); color: var(--bg-main);" onclick="startBotMatch('immortal')">Immortal Bot (Unbeatable)</button>
            </div>

            <!-- FRIENDS TAB -->
            <div id="view-friends" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 15px;">Add Friends</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                    <input type="text" id="friend-search" placeholder="Enter Username..." style="flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none;">
                    <button class="btn btn-outline" style="width: auto; margin: 0; padding: 0 20px;" onclick="sendFriendRequest()">Send</button>
                </div>

                <h4 style="margin: 15px 0 10px; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Pending</h4>
                <div id="requests-list"><p style="font-size: 0.85rem; color: var(--border);">No pending requests.</p></div>

                <h4 style="margin: 25px 0 10px; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">My Friends</h4>
                <div id="friends-list"></div>
            </div>

            <!-- PROFILE TAB (RESTORED WITH ALL FEATURES) -->
            <div id="view-profile" class="card tab-view" style="display: none;">
                <h3 style="margin-bottom: 20px; text-align: center;">Edit Profile</h3>
                
                <div class="file-upload-wrapper">
                    <img id="edit-avatar-preview" src="">
                    <input type="file" id="avatar-file" accept="image/*" onchange="handleImageUpload(event)">
                    <div class="file-upload-badge">✏️</div>
                </div>

                <label style="font-size: 0.8rem; color: var(--text-muted);">Display Name</label>
                <div class="input-group"><input type="text" id="edit-name" placeholder="Display Name"></div>
                
                <label style="font-size: 0.8rem; color: var(--text-muted);">Bio</label>
                <div class="input-group"><textarea id="edit-bio" placeholder="Write something about yourself..."></textarea></div>

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Gender</label>
                        <div class="input-group">
                            <select id="edit-gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Country</label>
                        <div class="input-group">
                            <select id="edit-country">
                                <option value="">Select...</option>
                                <option value="🇮🇳">🇮🇳 India</option>
                                <option value="🇺🇸">🇺🇸 USA</option>
                                <option value="🇬🇧">🇬🇧 UK</option>
                                <option value="🇨🇦">🇨🇦 Canada</option>
                                <option value="🇦🇺">🇦🇺 Australia</option>
                                <option value="🇵🇰">🇵🇰 Pakistan</option>
                                <option value="🇧🇩">🇧🇩 Bangladesh</option>
                                <option value="🇳🇵">🇳🇵 Nepal</option>
                                <option value="🇸🇬">🇸🇬 Singapore</option>
                                <option value="🇦🇪">🇦🇪 UAE</option>
                                <option value="🌍">🌍 Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <label style="font-size: 0.8rem; color: var(--text-muted);">Username (Unique ID)</label>
                <div class="input-group"><input type="text" id="edit-username" placeholder="username" disabled style="opacity: 0.5; cursor: not-allowed;"></div>
                
                <button class="btn" onclick="saveProfile()">Save Changes</button>
                <button class="btn btn-outline btn-danger" style="margin-top: 15px; border-color: var(--danger); color: var(--danger);" onclick="logout()">Log Out</button>
            </div>
        </div>

        <!-- 3. GAME SCREEN -->
        <div id="screen-game" class="screen" style="max-width: 1000px; padding-top: 10px;">
            <div class="game-layout">
                
                <!-- Left: Board -->
                <div class="board-col">
                    <div style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; background: var(--bg-panel); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border);">
                        <span id="room-code-display" style="color: var(--text-muted); font-size: 0.9rem;">Code: <strong id="room-display" style="color: #fff; letter-spacing: 1px;">---</strong></span>
                        <span id="copy-code-btn" onclick="copyInviteLink()" style="color: var(--x-color); cursor: pointer; font-size: 0.85rem; font-weight: 600;">Copy</span>
                    </div>

                    <div class="player-bar" id="opp-bar">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <img id="opp-avatar" src="" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border: 1px solid var(--border);">
                            <div>
                                <div style="font-weight: 600; font-size: 1.05rem;"><span id="opp-name">Waiting...</span> <span id="opp-flag" class="player-flag"></span></div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">Playing as <span id="opp-symbol" style="font-weight:700;">O</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="board" id="board"></div>

                    <div class="player-bar" id="my-bar">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <img id="my-avatar" src="" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border: 1px solid var(--border);">
                            <div>
                                <div style="font-weight: 600; font-size: 1.05rem;"><span id="my-name-game">Me</span> <span id="my-flag" class="player-flag"></span></div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">Playing as <span id="my-symbol" style="font-weight:700;">X</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions Panel -->
                    <div style="width: 100%; margin-top: 15px;">
                        <button id="hint-btn" class="btn btn-outline" style="border-color: var(--accent); color: var(--accent); display: none; margin-bottom: 10px;" onclick="showHint()">💡 Get Hint</button>
                        
                        <div id="end-actions" style="display: none; gap: 10px; width: 100%;">
                            <button class="btn" style="background: var(--text-main); color: var(--bg-main);" onclick="requestRematch()">Rematch</button>
                            <button class="btn btn-outline" onclick="leaveMatch()">Exit</button>
                        </div>
                        
                        <button id="cancel-btn" class="btn btn-outline btn-danger" style="display: none;" onclick="leaveMatch()">Cancel Match</button>
                        <button id="resign-btn" class="btn btn-outline" style="display: none;" onclick="resignMatch()">Resign</button>
                    </div>
                </div>

                <!-- Right: Chat -->
                <div class="chat-col" id="chat-col-wrapper">
                    <div class="chat-box" id="chat-container">
                        <div class="chat-messages" id="chat-messages">
                            <div style="text-align: center; color: var(--border); font-size: 0.75rem; margin-top: 10px;">Chat secured.</div>
                        </div>
                        
                        <div class="chat-quick-emojis">
                            <button class="emoji-btn" onclick="sendEmoji('😡')">😡</button>
                            <button class="emoji-btn" onclick="sendEmoji('😭')">😭</button>
                            <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                            <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                            <button class="emoji-btn" onclick="sendEmoji('💀')">💀</button>
                        </div>
                        
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                            <button onclick="sendChatMessage()">Send</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function handleResize() {
            const isDesktop = window.innerWidth >= 850;
            document.getElementById('desktop-nav').style.display = isDesktop ? 'flex' : 'none';
        }
        window.addEventListener('resize', handleResize); handleResize();

        // =========================================================================
        // STRICT FIREBASE CONFIGURATION (Provided)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyARdbrN_3V1Uk6KJ9JbHa6PJmv5Xtfv9Fw",

            const errBox = document.getElementById('auth-error');
            let cleanMsg = "Authentication failed.";
            if (error.code && (error.code.includes('invalid-credential') || error.code.includes('wrong-password') || error.code.includes('invalid-login-credentials'))) { cleanMsg = "Incorrect Email or Password."; } 
            else if (error.code && error.code.includes('user-not-found')) { cleanMsg = "Account not found."; }
            else if (error.code && error.code.includes('email-already-in-use')) { cleanMsg = "Email already registered."; }
            else { cleanMsg = error.message; }
            errBox.innerText = cleanMsg; errBox.style.display = 'block';
            document.getElementById('btn-action').innerText = isLoginMode ? "Log In" : "Sign Up";
        }

        function processAuth() {

            if(!email || !pass) { errBox.innerText = "Please fill all fields."; errBox.style.display = 'block'; return; }
            document.getElementById('btn-action').innerText = "Processing...";

            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .then(() => {
                if(isLoginMode) {
                    return auth.signInWithEmailAndPassword(email, pass);
                } else {
                    // STRCIT USERNAME FIX
                    let cleanUser = username.replace(/[^a-z0-9_]/g, '');
                    if(cleanUser !== username || username.length < 3) {
                        throw new Error("Username must be at least 3 chars and only contain letters, numbers, or underscores.");
                    }
                    
                    return db.ref('usernames/' + cleanUser).once('value').then(snap => {
                        if(snap.exists()) { throw new Error("Username already taken!"); }
                        return auth.createUserWithEmailAndPassword(email, pass).then(cred => {

        function buildBoardUI() {
            const b = document.getElementById("board"); b.innerHTML = "";

        function syncMultiplayerState(snap) {
            const data = snap.val(); if(!data) return;
            localBoard = data.board || ["", "", "", "", "", "", "", "", ""];
            currentTurn = data.turn; gameActive = data.status === "active";

            const oppData = myRole === "X" ? data.playerO : data.playerX;
            document.getElementById('opp-name').innerText = oppData ? oppData.name : "Searching for player...";
            document.getElementById('opp-avatar').src = oppData ? oppData.photoURL : "https://ui-avatars.com/api/?name=O";
            document.getElementById('opp-flag').innerText = oppData ? (oppData.flag || "") : "";
            
            if(data.status === "waiting") {
                document.getElementById('cancel-btn').style.display = 'block'; document.getElementById('resign-btn').style.display = 'none';
            } else if (gameActive) {
                document.getElementById('cancel-btn').style.display = 'none'; document.getElementById('resign-btn').style.display = 'block';
            }
            
            updateBoardVisuals(); updateTurnHighlight();
            if(data.status === "rematch_requested" && data.rematchBy !== currentUser.uid) { showNoti("Opponent wants a rematch!"); }

            if(data.status === "finished") {
                gameActive = false;
                document.getElementById('end-actions').style.display = 'flex';
                document.getElementById('cancel-btn').style.display = 'none'; document.getElementById('resign-btn').style.display = 'none';
                
                if(data.winner === currentUser.uid || data.winner === myRole + "_WIN") {
                    showNoti("You Won! 🎉 (+2 Points)");
                    if(!pointsAwarded) { pointsAwarded = true; db.ref('users/' + currentUser.uid + '/points').transaction(c => (c || 0) + 2); }
                } else if(data.winner === "draw") { showNoti("Match Draw!"); }
                else if(data.reason === "resigned" && data.winner !== currentUser.uid) { showNoti("Opponent Resigned. You win!"); }
                else if(data.reason === "resigned" && data.winner === currentUser.uid) { showNoti("You Resigned."); }
                else { showNoti("You Lost!"); }
            }
        }

        function makeMove(i) {
            if(!gameActive || currentTurn !== myRole || localBoard[i] !== "") return;
            localBoard[i] = myRole; updateBoardVisuals();
            
            let status = "active"; let winner = null;
            if(checkWin(localBoard, myRole)) { status = "finished"; winner = currentUser.uid; } 
            else if(!localBoard.includes("")) { status = "finished"; winner = "draw"; }

            if(isBotMatch) {
                currentTurn = myRole === "X" ? "O" : "X"; updateTurnHighlight();
                if(status === "finished") { handleBotGameOver(winner); return; }
                setTimeout(botMakeMove, 500); 
            } else {
                db.ref('rooms/' + currentRoomId).update({ board: localBoard, turn: myRole === "X" ? "O" : "X", status: status, ...(winner && {winner}) });
            }
        }

        function updateBoardVisuals() {
            const cells = document.querySelectorAll('.cell');
            localBoard.forEach((val, i) => { 
                if(val && cells[i].innerText !== val) { cells[i].innerText = val; cells[i].className = "cell " + val; }
                if(!val) { cells[i].innerText = ""; cells[i].className = "cell"; }
            });
        }
        function updateTurnHighlight() {
            document.getElementById('my-bar').classList.toggle('active-turn', currentTurn === myRole);
            document.getElementById('opp-bar').classList.toggle('active-turn', currentTurn !== myRole);

        function checkWin(board, player) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => board[c[0]]===player && board[c[1]]===player && board[c[2]]===player);
        }

        // ==========================================
        // 5. AI BOT & HINT ENGINE
        // ==========================================
        function startBotMatch(difficulty) {
            isBotMatch = true; botDifficulty = difficulty; pointsAwarded = false;
            currentRoomId = "BOT_ROOM"; myRole = "X"; currentTurn = "X"; gameActive = true;
            localBoard = ["", "", "", "", "", "", "", "", ""];

        function showHint() {
            if(!isBotMatch || currentTurn !== myRole || !gameActive) return;
            let move = getBestMove(localBoard, myRole);
            const cells = document.querySelectorAll('.cell');
            cells[move].classList.add('hint-anim');
            setTimeout(() => cells[move].classList.remove('hint-anim'), 1000);
        }

        function botMakeMove() {
            if(!gameActive) return;
            let moveIndex = -1; const botPlayer = myRole === "X" ? "O" : "X";
            
            let rand = 0;
            if(botDifficulty === 'beginner') rand = 0.8; 
            if(botDifficulty === 'intermediate') rand = 0.4; 
            if(botDifficulty === 'pro') rand = 0.15; 
            if(botDifficulty === 'legend') rand = 0.05; 
            if(botDifficulty === 'immortal') rand = 0.0; 

            if(Math.random() < rand) {
                let empty = []; localBoard.forEach((v, i) => { if(v === "") empty.push(i); });
                moveIndex = empty[Math.floor(Math.random() * empty.length)];
            } else { moveIndex = getBestMove(localBoard, botPlayer); }

            localBoard[moveIndex] = botPlayer; updateBoardVisuals();

            if(checkWin(localBoard, botPlayer)) { handleBotGameOver("BOT"); }
            else if(!localBoard.includes("")) { handleBotGameOver("draw"); }
            else { currentTurn = myRole; updateTurnHighlight(); }
        }

        function handleBotGameOver(winner) {
            gameActive = false;
            document.getElementById('end-actions').style.display = 'flex';
            document.getElementById('resign-btn').style.display = 'none';
            
            if(winner === "draw") showNoti("Match Draw!");
            else if(winner === "opp_win") showNoti("You Resigned.");
            else if(winner === "BOT") showNoti("Bot Won!");
            else { showNoti("You Won! 🎉"); }
        }

        function getBestMove(board, player) {
            let bestScore = -Infinity; let move = -1;
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = player;
                    let score = minimax(board, 0, false, player);
                    board[i] = "";
                    if(score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(board, depth, isMaximizing, botPlayer) {
            const humanPlayer = botPlayer === "X" ? "O" : "X";
            if(checkWin(board, botPlayer)) return 10 - depth;
            if(checkWin(board, humanPlayer)) return depth - 10;
            if(!board.includes("")) return 0;

            if(isMaximizing) {
                let bestScore = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = botPlayer;
                        bestScore = Math.max(bestScore, minimax(board, depth + 1, false, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = humanPlayer;
                        bestScore = Math.min(bestScore, minimax(board, depth + 1, true, botPlayer));
                        board[i] = "";
                    }
                }
                return bestScore;
            }
        }
    </script>
